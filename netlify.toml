# Netlify — site statique, sans framework ni dépendance.
# La commande copie uniquement les fichiers du site dans dist/ (pas d'outils ni de README en ligne).
[build]
  command = "sh tools/build.sh"
  publish = "dist"

# En-têtes de sécurité pour toutes les pages (le site n'a aucun script en ligne).
# Si le badge Netlify est réactivé, il faudra ajouter 'unsafe-inline' à script-src.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"

# Three.js : fichier versionné, mis en cache un an
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images, données du campus, logos : cache court, revalidé en arrière-plan
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
